<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification</title>
</head>
<body style="margin:0;padding:0;background-color:#faf7f2;font-family:Georgia,serif;color:#3d2c1e;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#faf7f2;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e8dfd3;border-radius:12px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:24px;color:#8b4513;">Tarifet</h1>
              <p style="margin:0 0 16px;line-height:1.6;">Hello {{FullName}},</p>
              <p style="margin:0 0 24px;line-height:1.6;">Please verify your email address by clicking the button below. This link expires in 24 hours.</p>
              <p style="margin:0 0 24px;text-align:center;">
                <a href="{{VerificationUrl}}" style="display:inline-block;background-color:#8b4513;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:bold;">Verify Email</a>
              </p>
              <p style="margin:0 0 16px;line-height:1.6;font-size:14px;color:#6b5344;">If the button does not work, copy and paste this link into your browser:</p>
              <p style="margin:0 0 24px;line-height:1.6;font-size:14px;word-break:break-all;color:#8b4513;">{{VerificationUrl}}</p>
              <p style="margin:0;font-size:12px;color:#9a8b7e;">&copy; {{Year}} Tarifet</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
